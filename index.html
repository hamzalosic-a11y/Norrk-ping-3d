onkeydown=e=>{K[e.key]=1;K[e.key.toLowerCase()]=1;if(e.key==' ')e.preventDefault();if(e.key=='e'||e.key=='E')act();if(e.key=='i'&&!paused)status()};
onkeyup=e=>{K[e.key]=0;K[e.key.toLowerCase()]=0};
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1;if(k=='e')act()};b.onpointerup=b.onpointerleave=()=>K[k]=0});
function over(m){M('💀 Game over','Du klarade '+P.day+' dagar i Norrköping. '+m,[['Börja om',init]])}
function spawn(){const tg=nav()?6:night()?3:1;if(G.length>=tg)return;for(let i=0;i<10;i++){const a=Math.random()*6.28,d=35+Math.random()*20,x=P.x+Math.cos(a)*d,z=P.z+Math.sin(a)*d;if(!blocked(x,z,1)){G.push({m:person(0x8b1a1a,0xc9a07a),x,z,hp:3,c:0});return}}}
function upd(){T++;const sp=(K.Shift&&P.en>5)?.28:.15,dx=Math.sin(yaw),dz=Math.cos(yaw),f=(K.w||K.ArrowUp?1:0)-(K.s||K.ArrowDown?1:0),s=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0);if(K.z)yaw+=.03;if(K.x)yaw-=.03;
let mx=dx*f-dz*s,mz=dz*f+dx*s;const l=Math.hypot(mx,mz);if(l){mx=mx/l*sp;mz=mz/l*sp;if(!blocked(P.x+mx,P.z,.7))P.x+=mx;if(!blocked(P.x,P.z+mz,.7))P.z+=mz;pm.rotation.y=Math.atan2(mx,mz);if(sp>.15)P.en-=.05}
pm.position.set(P.x,l?Math.abs(Math.sin(T*.3))*.2:0,P.z);
P.min+=1/15;P.hu-=.003;P.en=Math.min(100,P.en+.004);if(P.hu<=0){P.hu=0;P.hp-=.02}if(P.min>=1440){P.min-=1440;P.day++}
if(T%120==0)spawn();cd--;hitcd--;
if(K[' ']&&cd<=0){cd=20;pm.rotation.x=.4;setTimeout(()=>pm.rotation.x=0,120);for(const g of G)if(Math.hypot(g.x-P.x,g.z-P.z)<3.4){g.hp-=1+Math.floor(P.fi/25);g.x+=(g.x-P.x);g.z+=(g.z-P.z)}}
for(let i=G.length-1;i>=0;i--){const g=G[i],d=Math.hypot(P.x-g.x,P.z-g.z);if(g.hp<=0||d>110){if(g.hp<=0){const m=10+Math.floor(Math.random()*20);P.mo+=m;P.kills++;say('Du slog ner en gängmedlem! +'+m+' kr')}S.remove(g.m);G.splice(i,1);continue}
const ch=d<(nav()?45:30);const vx=ch?(P.x-g.x)/d*.08:Math.cos(T/50+i)*.02,vz=ch?(P.z-g.z)/d*.08:Math.sin(T/60+i)*.02;if(!blocked(g.x+vx,g.z,.7))g.x+=vx;if(!blocked(g.x,g.z+vz,.7))g.z+=vz;g.m.position.set(g.x,0,g.z);g.m.rotation.y=Math.atan2(P.x-g.x,P.z-g.z);g.c--;
if(d<1.8&&g.c<=0){g.c=60;P.hp-=8;const m=Math.min(P.mo,20);P.mo-=m;say('Gängmedlem slår dig! -8 HP'+(m?', -'+m+' kr stulet':''))}}
for(const n of NP){if(n.w>0){n.w--}else{const d=Math.hypot(n.tx-n.x,n.tz-n.z);if(d<1){n.w=60+Math.random()*200|0;n.tx=n.x+Math.random()*40-20;n.tz=n.z+Math.random()*40-20}else{const vx=(n.tx-n.x)/d*.04,vz=(n.tz-n.z)/d*.04;if(!blocked(n.x+vx,n.z+vz,.8)){n.x+=vx;n.z+=vz;n.m.rotation.y=Math.atan2(vx,vz)}else{n.tx=n.x;n.tz=n.z}}}n.m.position.set(n.x,0,n.z)}
for(const c of CR){c.z+=c.d*.35;if(c.z>170)c.z=-90;if(c.z<-90)c.z=170;c.m.position.set(c.x,.4+.65,c.z);if(Math.abs(P.x-c.x)<2&&Math.abs(P.z-c.z)<3&&hitcd<=0){hitcd=60;P.hp-=12;P.x+=P.x<c.x?-2.5:2.5;say('Du blev påkörd av en bil! -12 HP')}}
tv();if(P.hp<=0)over(P.hu<=0?'Du svalt ihjäl.':'Du dog.');cl()}
const SK=new THREE.Color(),DK=new THREE.Color(0x0a1030),LT=new THREE.Color(0x87ceeb);
function draw(){const t=P.min/60,fd=t>=6&&t<=20?Math.sin((t-6)/14*Math.PI):0,f=.12+.88*fd;SK.copy(DK).lerp(LT,f);S.background=SK;S.fog.color.copy(SK);HL.intensity=.3+.7*f;SUN.intensity=.1+.8*f;
const dx=Math.sin(yaw),dz=Math.cos(yaw),d=13;CAM.position.set(P.x-dx*d*Math.cos(pit),2+d*Math.sin(pit),P.z-dz*d*Math.cos(pit));CAM.lookAt(P.x,2,P.z);R.render(S,CAM);
const n=near();pr.style.display=n&&!paused?'block':'none';if(n)pr.textContent='E: '+n.n;
if(T%8==0){const m=Math.floor(P.min%60);HUD.innerHTML='❤ '+Math.ceil(P.hp)+' ⚡ '+Math.floor(P.en)+' 🍔 '+Math.floor(P.hu)+' 💰 '+P.mo+' kr &nbsp;🕒 '+String(hr()).padStart(2,'0')+':'+String(m).padStart(2,'0')+' Dag '+P.day+' 📍'+area()+'<br>📚 '+P.kn+' 💪 '+P.fi+' ⚽ '+P.sk+' &nbsp;'+(P.job||'arbetslös')+(P.club?' | '+P.club:'')+' <small>(WASD, dra=kamera, Shift=sprint, Space=slå, E=interagera, I=status)</small>'}}
let frameNo=0;function loop(){requestAnimationFrame(loop);if(!paused)upd();if((frameNo++&1)===0)draw()}
init();M('🏙️ Norrköping 3D','Utforska staden i 3D: gå i skolan, plugga på Campus, spela fotboll, jobba och träna. Prata med Norrköpingsbor, akta dig för bilar och gäng – särskilt i Navestad och på natten!',[['Börja spela',()=>say('Gå till byggnader och tryck E')]]);loop();

</script></body></html>
